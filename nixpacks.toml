[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.zip", "php83Extensions.gd", "php83Extensions.bcmath", "php83Extensions.curl", "composer"]

[phases.install]
cmds = ["cd backend && composer install --no-dev --optimize-autoloader"]

[start]
cmd = "cd backend && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"